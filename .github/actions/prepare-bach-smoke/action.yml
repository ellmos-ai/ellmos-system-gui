name: Prepare isolated BACH smoke
description: Install the reviewed public BACH snapshot and fetch its pinned GUI release.
inputs:
  github-token:
    description: Read-only token for the release download
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ellmos-ai/bach
        ref: ce20085d1324a13b1ddd017bb7eeed6de475eca4
        path: .ci-bach
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the public BACH dependencies
      shell: bash
      run: |
        test "$(git -C .ci-bach rev-parse HEAD)" = ce20085d1324a13b1ddd017bb7eeed6de475eca4
        grep -v -E '^(assistant-core|accounts-core|ellmos-chat) @' .ci-bach/requirements.txt > "$RUNNER_TEMP/bach-requirements.txt"
        python -m pip install -r "$RUNNER_TEMP/bach-requirements.txt" 'fastapi>=0.128.0' 'starlette>=0.50.0' 'uvicorn>=0.40.0' 'python-telegram-bot>=22,<23' 'mcp>=1,<2' \
          'ellmos-talk @ git+https://github.com/ellmos-ai/ellmos-talk.git@bc4686195405c60b7614d3244e6490d13cfe19f0'
    - name: Fetch the shared GUI release pinned by BACH
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      shell: bash
      run: |
        pin=.ci-bach/system/gui/gui-consumer.v1.json
        version=$(jq -er '.version' "$pin")
        archive=$(jq -er '.release_archive' "$pin")
        [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        [[ $archive =~ ^ellmos-system-gui-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}\.zip$ ]]
        gh release download "v$version" --repo ellmos-ai/ellmos-system-gui --pattern "$archive" --output "$RUNNER_TEMP/bach-gui.zip"
        printf 'BACH_SMOKE_ARCHIVE=%s\n' "$RUNNER_TEMP/bach-gui.zip" >> "$GITHUB_ENV"
