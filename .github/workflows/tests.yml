name: Native GUI validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and static build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing GUI contract tests
        run: npm test
      - name: Build static distribution and manifest
        run: npm run build:release
      - name: Verify manifest hashes and local preview archive
        run: python scripts/package_release.py
      - name: Upload verified web preview archive
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-${{ runner.os }}-${{ github.run_attempt }}
          path: release/ellmos-system-gui-*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
