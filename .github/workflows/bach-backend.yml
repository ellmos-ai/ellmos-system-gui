name: BACH backend integration

on:
  pull_request:
    paths:
      - '.github/workflows/bach-backend.yml'
      - 'scripts/check-bach-backend.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bach-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACH_COMMIT: a2e40a36618e1acf9c2a7b3fe08f4ee174c6f8f8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ellmos-ai/bach
          ref: ${{ env.BACH_COMMIT }}
          path: .ci-bach
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public BACH and browser dependencies
        shell: bash
        run: |
          grep -v -E '^(assistant-core|accounts-core|ellmos-chat) @' .ci-bach/requirements.txt > "$RUNNER_TEMP/bach-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/bach-requirements.txt" 'fastapi>=0.128.0' 'starlette>=0.50.0' 'uvicorn>=0.40.0' 'python-telegram-bot>=22,<23' 'mcp>=1,<2' playwright
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/bach-playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          python -m playwright install --with-deps chromium
      - name: Fetch the shared GUI release pinned by BACH
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pin=.ci-bach/system/gui/gui-consumer.v1.json
          version=$(jq -er '.version' "$pin")
          archive=$(jq -er '.release_archive' "$pin")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $archive =~ ^ellmos-system-gui-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}\.zip$ ]]
          gh release download "v$version" --repo ellmos-ai/ellmos-system-gui --pattern "$archive" --output "$RUNNER_TEMP/bach-gui.zip"
      - name: Verify BACH pages, authenticated data and worker readback
        shell: bash
        run: |
          test "$(git -C .ci-bach rev-parse HEAD)" = "$BACH_COMMIT"
          python scripts/check-bach-backend.py .ci-bach "$RUNNER_TEMP/bach-gui.zip" "$RUNNER_TEMP/bach-readback"
      - uses: actions/upload-artifact@v4
        with:
          name: bach-backend-readback
          path: ${{ runner.temp }}/bach-readback
          if-no-files-found: error
