name: Desktop compile

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'docs/DESKTOP-APP.md'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'docs/DESKTOP-APP.md'

permissions:
  contents: read

env:
  DESKTOP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve one dependency graph for all platforms
        working-directory: src-tauri
        shell: bash
        run: |
          if test -f Cargo.lock; then
            cargo metadata --locked --no-deps --format-version 1 > /dev/null
          else
            cargo generate-lockfile
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri/Cargo.lock
  compile:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DESKTOP_BUNDLES: ${{ matrix.bundles }}
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/desktop-toolchain/package-lock.json
      - name: Install locked desktop build tools
        working-directory: .github/desktop-toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - name: Remove cached bundle outputs
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path('src-tauri/target').resolve()
          bundles = target / 'release/bundle'
          assert bundles.resolve().is_relative_to(target) and not bundles.is_symlink()
          if bundles.exists():
              shutil.rmtree(bundles)
      - name: Pre-populate Linux Tauri AppImage bundler tools via GitHub API
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/tauri"
          gh release download apprun-old --repo tauri-apps/binary-releases --pattern "AppRun-x86_64" --dir "$HOME/.cache/tauri" --clobber
          chmod +x "$HOME/.cache/tauri/AppRun-x86_64"
          gh release download linuxdeploy-07333c6 --repo tauri-apps/binary-releases --pattern "linuxdeploy-x86_64.AppImage" --dir "$HOME/.cache/tauri" --clobber
          mv -f "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage"
          gh release download continuous --repo linuxdeploy/linuxdeploy-plugin-appimage --pattern "linuxdeploy-plugin-appimage-x86_64.AppImage" --dir "$HOME/.cache/tauri" --clobber
          mv -f "$HOME/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
      - name: Pre-populate Windows Tauri NSIS bundler tools via GitHub API
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tauriCache = Join-Path $env:LOCALAPPDATA "tauri"
          Remove-Item -Recurse -Force (Join-Path $tauriCache "NSIS"), (Join-Path $tauriCache "nsis-3.13") -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tauriCache | Out-Null
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern "nsis-3.13.zip" --dir $env:RUNNER_TEMP --clobber
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP "nsis-3.13.zip") -DestinationPath $tauriCache -Force
          Rename-Item -Path (Join-Path $tauriCache "nsis-3.13") -NewName "NSIS"
          $pluginsAdd = Join-Path $tauriCache "NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $pluginsAdd | Out-Null
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern "nsis_tauri_utils.dll" --dir $pluginsAdd --clobber
      - name: Compile desktop consumer and unsigned installer candidates
        shell: bash
        run: node .github/desktop-toolchain/node_modules/@tauri-apps/cli/tauri.js build --ci --no-sign --bundles "$DESKTOP_BUNDLES" -- --locked
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, struct
          binary = pathlib.Path('src-tauri/target/release/ellmos-system-gui-desktop.exe').read_bytes()
          pe = struct.unpack_from('<I', binary, 0x3c)[0]
          assert binary[pe:pe+4] == b'PE\0\0'
          subsystem = struct.unpack_from('<H', binary, pe + 24 + 68)[0]
          assert subsystem == 2, f'Expected GUI subsystem, got {subsystem}'
          print('Windows binary uses GUI subsystem; no console subsystem.')
      - name: Package compiled desktop consumer and source receipt
        run: python scripts/package-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-consumer-${{ runner.os }}-${{ env.DESKTOP_SOURCE_COMMIT }}
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14
