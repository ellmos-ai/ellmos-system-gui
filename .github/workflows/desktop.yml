name: Desktop compile

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'scripts/check-windows-installer.ps1'
      - 'scripts/check-windows-webview.mjs'
      - 'scripts/check-native-gui-pages.mjs'
      - 'scripts/check-linux-installer.py'
      - 'scripts/check-linux-webview.mjs'
      - 'scripts/desktop_update_fixture.py'
      - 'scripts/check-macos-installer.py'
      - 'docs/DESKTOP-APP.md'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'scripts/check-windows-installer.ps1'
      - 'scripts/check-windows-webview.mjs'
      - 'scripts/check-native-gui-pages.mjs'
      - 'scripts/check-linux-installer.py'
      - 'scripts/check-linux-webview.mjs'
      - 'scripts/desktop_update_fixture.py'
      - 'scripts/check-macos-installer.py'
      - 'docs/DESKTOP-APP.md'
  workflow_dispatch:
    inputs:
      legacy_run:
        description: 'Successful main-branch desktop build for BACH Ocean'
        type: string
        required: true
      legacy_commit:
        description: 'Exact source commit of that desktop build'
        type: string
        required: true
      legacy_installer_sha256:
        description: 'Expected SHA-256 of the BACH Ocean NSIS installer'
        type: string
        required: true
      legacy_deb_sha256:
        description: 'Expected SHA-256 of the Debian package from the same build (optional migration test)'
        type: string
      legacy_appimage_sha256:
        description: 'Expected SHA-256 of the AppImage from the same build (optional signed update test)'
        type: string
      legacy_dmg_sha256:
        description: 'Expected SHA-256 of the macOS DMG from the same build (optional migration test)'
        type: string

permissions:
  contents: read
  actions: read

env:
  DESKTOP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve one dependency graph for all platforms
        working-directory: src-tauri
        shell: bash
        run: |
          if test -f Cargo.lock; then
            cargo metadata --locked --no-deps --format-version 1 > /dev/null
          else
            cargo generate-lockfile
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri/Cargo.lock
  compile:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DESKTOP_BUNDLES: ${{ matrix.bundles }}
      NO_STRIP: 'true'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/desktop-toolchain/package-lock.json
      - name: Install locked dependencies for the WebView smoke
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the shared GUI for the native WebView smoke
        if: runner.os == 'Windows' || runner.os == 'Linux'
        run: npm run build:release
      - name: Install locked desktop build tools
        working-directory: .github/desktop-toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          webdriver=webkitgtk-webdriver
          if ! apt-cache policy "$webdriver" | awk '$1 == "Candidate:" && $2 != "(none)" { found=1 } END { exit !found }'; then
            webdriver=webkit2gtk-driver
          fi
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64 xvfb xauth xdotool dbus-daemon "$webdriver" openbox wmctrl
      - name: Remove cached bundle outputs
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path('src-tauri/target').resolve()
          bundles = target / 'release/bundle'
          assert bundles.resolve().is_relative_to(target) and not bundles.is_symlink()
          if bundles.exists():
              shutil.rmtree(bundles)
      - name: Pre-populate Linux Tauri AppImage bundler tools via GitHub API
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/tauri"
          gh release download apprun-old --repo tauri-apps/binary-releases --pattern "AppRun-x86_64" --dir "$HOME/.cache/tauri" --clobber
          chmod +x "$HOME/.cache/tauri/AppRun-x86_64"
          gh release download linuxdeploy-07333c6 --repo tauri-apps/binary-releases --pattern "linuxdeploy-x86_64.AppImage" --dir "$HOME/.cache/tauri" --clobber
          mv -f "$HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage"
          gh release download continuous --repo linuxdeploy/linuxdeploy-plugin-appimage --pattern "linuxdeploy-plugin-appimage-x86_64.AppImage" --dir "$HOME/.cache/tauri" --clobber
          mv -f "$HOME/.cache/tauri/linuxdeploy-plugin-appimage-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
      - name: Pre-populate Windows Tauri NSIS bundler tools via GitHub API
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tauriCache = Join-Path $env:LOCALAPPDATA "tauri"
          Remove-Item -Recurse -Force (Join-Path $tauriCache "NSIS"), (Join-Path $tauriCache "nsis-3.13") -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $tauriCache | Out-Null
          gh release download nsis-3.13 --repo tauri-apps/binary-releases --pattern "nsis-3.13.zip" --dir $env:RUNNER_TEMP --clobber
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP "nsis-3.13.zip") -DestinationPath $tauriCache -Force
          Rename-Item -Path (Join-Path $tauriCache "nsis-3.13") -NewName "NSIS"
          $pluginsAdd = Join-Path $tauriCache "NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force -Path $pluginsAdd | Out-Null
          gh release download nsis_tauri_utils-v0.5.3 --repo tauri-apps/nsis-tauri-utils --pattern "nsis_tauri_utils.dll" --dir $pluginsAdd --clobber
      - name: Compile desktop consumer and unsigned installer candidates
        shell: bash
        run: node .github/desktop-toolchain/node_modules/@tauri-apps/cli/tauri.js build --ci --no-sign --bundles "$DESKTOP_BUNDLES" -- --locked
      - name: Verify signed update validation
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo test --release --locked desktop_updates::tests
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, struct
          binary = pathlib.Path('src-tauri/target/release/ellmos-system-gui-desktop.exe').read_bytes()
          pe = struct.unpack_from('<I', binary, 0x3c)[0]
          assert binary[pe:pe+4] == b'PE\0\0'
          subsystem = struct.unpack_from('<H', binary, pe + 24 + 68)[0]
          assert subsystem == 2, f'Expected GUI subsystem, got {subsystem}'
          print('Windows binary uses GUI subsystem; no console subsystem.')
      - name: Package compiled desktop consumer and source receipt
        run: python scripts/package-desktop.py
      - name: Verify legacy desktop artifact source
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (runner.os == 'Windows' ||
          (runner.os == 'Linux' && (inputs.legacy_deb_sha256 != '' || inputs.legacy_appimage_sha256 != '')) ||
          (runner.os == 'macOS' && inputs.legacy_dmg_sha256 != ''))
        env:
          GH_TOKEN: ${{ github.token }}
          LEGACY_RUN: ${{ inputs.legacy_run }}
          LEGACY_COMMIT: ${{ inputs.legacy_commit }}
        shell: pwsh
        run: |
          if ($env:LEGACY_RUN -notmatch '^[0-9]+$' -or $env:LEGACY_COMMIT -cnotmatch '^[a-f0-9]{40}$') {
            throw 'Expected a run ID and exact legacy commit.'
          }
          $run = gh run view $env:LEGACY_RUN --repo $env:GITHUB_REPOSITORY --json headSha,headBranch,event,conclusion,workflowName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.headSha -cne $env:LEGACY_COMMIT -or $run.headBranch -cne 'main' -or
              $run.event -cne 'push' -or $run.conclusion -cne 'success' -or $run.workflowName -cne 'Desktop compile') {
            throw 'The legacy run is not the successful main-branch desktop build requested.'
          }
      - uses: actions/download-artifact@v4
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (runner.os == 'Windows' ||
          (runner.os == 'Linux' && (inputs.legacy_deb_sha256 != '' || inputs.legacy_appimage_sha256 != '')) ||
          (runner.os == 'macOS' && inputs.legacy_dmg_sha256 != ''))
        with:
          name: desktop-consumer-${{ runner.os }}-${{ inputs.legacy_commit }}
          run-id: ${{ inputs.legacy_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/legacy-desktop
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        env:
          LEGACY_RUN: ${{ inputs.legacy_run }}
          LEGACY_COMMIT: ${{ inputs.legacy_commit }}
          LEGACY_INSTALLER_SHA256: ${{ inputs.legacy_installer_sha256 }}
        shell: pwsh
        run: ./scripts/check-windows-installer.ps1
      - name: Verify Debian installer lifecycle
        if: runner.os == 'Linux'
        env:
          LEGACY_RUN: ${{ inputs.legacy_run }}
          LEGACY_COMMIT: ${{ inputs.legacy_commit }}
          LEGACY_DEB_SHA256: ${{ inputs.legacy_deb_sha256 }}
          LEGACY_APPIMAGE_SHA256: ${{ inputs.legacy_appimage_sha256 }}
        run: xvfb-run -a dbus-run-session -- python scripts/check-linux-installer.py
      - name: Verify macOS DMG lifecycle
        if: runner.os == 'macOS'
        env:
          LEGACY_RUN: ${{ inputs.legacy_run }}
          LEGACY_COMMIT: ${{ inputs.legacy_commit }}
          LEGACY_DMG_SHA256: ${{ inputs.legacy_dmg_sha256 }}
        run: python scripts/check-macos-installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-consumer-${{ runner.os }}-${{ env.DESKTOP_SOURCE_COMMIT }}
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14
