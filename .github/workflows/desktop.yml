name: Desktop compile

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'docs/DESKTOP-APP.md'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/desktop-toolchain/**'
      - 'scripts/package-desktop.py'
      - 'docs/DESKTOP-APP.md'

permissions:
  contents: read

env:
  DESKTOP_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve one dependency graph for all platforms
        working-directory: src-tauri
        shell: bash
        run: |
          if test -f Cargo.lock; then
            cargo metadata --locked --no-deps --format-version 1 > /dev/null
          else
            cargo generate-lockfile
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri/Cargo.lock
  compile:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      DESKTOP_BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DESKTOP_SOURCE_COMMIT }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/desktop-toolchain/package-lock.json
      - name: Install locked desktop build tools
        working-directory: .github/desktop-toolchain
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-dependency-lock
          path: src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-desktop-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2t64
      - name: Remove cached bundle outputs
        shell: python
        run: |
          from pathlib import Path
          import shutil
          target = Path('src-tauri/target').resolve()
          bundles = target / 'release/bundle'
          assert bundles.resolve().is_relative_to(target) and not bundles.is_symlink()
          if bundles.exists():
              shutil.rmtree(bundles)
      - name: Compile desktop consumer and unsigned installer candidates
        shell: bash
        run: node .github/desktop-toolchain/node_modules/@tauri-apps/cli/tauri.js build --ci --no-sign --bundles "$DESKTOP_BUNDLES" -- --locked
      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: python
        run: |
          import pathlib, struct
          binary = pathlib.Path('src-tauri/target/release/ellmos-system-gui-desktop.exe').read_bytes()
          pe = struct.unpack_from('<I', binary, 0x3c)[0]
          assert binary[pe:pe+4] == b'PE\0\0'
          subsystem = struct.unpack_from('<H', binary, pe + 24 + 68)[0]
          assert subsystem == 2, f'Expected GUI subsystem, got {subsystem}'
          print('Windows binary uses GUI subsystem; no console subsystem.')
      - name: Package compiled desktop consumer and source receipt
        run: python scripts/package-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-consumer-${{ runner.os }}-${{ env.DESKTOP_SOURCE_COMMIT }}
          path: desktop-package/
          if-no-files-found: error
          retention-days: 14
